# SetFlow CI/CD Pipeline
# Builds and tests every push / pull request on main, stage branches, and CI repair branches.
# A "v*" tag publishes release APKs (arm64-v8a, armeabi-v7a, universal) with zero network permissions.
name: SetFlow CI / CD

'on':
  push:
    branches:
      - main
      - master
      - 'stage-*'
      - 'audit/*'
      - 'ci/*'
    tags: ["v*"]
  pull_request:
    branches:
      - main
      - master
      - 'stage-*'
      - 'ci/*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compute artifact name
        id: artifact_meta
        shell: bash
        run: |
          REF_SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr -cd '[:alnum:]-_')
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "name=setflow-debug-${REF_SLUG}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      # Unit tests across automix (JVM) and app (Android unit tests)
      - name: Unit tests
        id: unit_tests
        run: ./gradlew :automix:test :app:testDebugUnitTest --stacktrace --console=plain

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ steps.artifact_meta.outputs.name }}
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Verify that merged release manifest strictly strips all network & install permissions
      - name: Verify Merged Manifest Permissions
        run: |
          ./gradlew :app:processReleaseMainManifest --console=plain
          MANIFEST="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::Security gate failure: android.permission.INTERNET found in release manifest!"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST"; then
            echo "::error::Security gate failure: android.permission.ACCESS_NETWORK_STATE found in release manifest!"
            exit 1
          fi
          if grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            echo "::error::Security gate failure: android.permission.REQUEST_INSTALL_PACKAGES found in release manifest!"
            exit 1
          fi
          echo "Manifest security gate PASSED: 100% offline, zero network permissions."

      - name: Debug APK
        id: debug_apk
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload Debug APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact_meta.outputs.name }}
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Report Build & Test Status Summary
        if: always()
        run: |
          echo "### SetFlow CI Run Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests (:automix:test & :app:testDebugUnitTest)**: ${{ steps.unit_tests.outcome == 'success' && ':white_check_mark: PASSED' || ':x: FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK Compilation (:app:assembleDebug)**: ${{ steps.debug_apk.outcome == 'success' && ':white_check_mark: PASSED' || (steps.debug_apk.outcome == 'skipped' && ':heavy_minus_sign: SKIPPED' || ':x: FAILED') }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Device Smoke / Runtime Tests**: :warning: NOT RUN (Unit test matrix only in CI runner)" >> $GITHUB_STEP_SUMMARY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous tag, for a beta's notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Strict semver tags, so Obtainium and the app compare versions right: "v0.14.0-beta.1" or "v1.0.0".
      - name: Tag format
        working-directory: .
        run: python3 tools/check_tag.py "$GITHUB_REF_NAME"

      # Release keystores
      - name: Signing key
        env:
          BETA: ${{ contains(github.ref_name, '-') }}
          BETA_KEYSTORE: ${{ secrets.SETFLOW_KEYSTORE_BASE64 }}
          STABLE_KEYSTORE: ${{ secrets.SETFLOW_STABLE_KEYSTORE_BASE64 }}
        run: |
          if [ "$BETA" = "true" ]; then KEYSTORE_BASE64="$BETA_KEYSTORE"; NAME=SETFLOW_KEYSTORE_BASE64; else KEYSTORE_BASE64="$STABLE_KEYSTORE"; NAME=SETFLOW_STABLE_KEYSTORE_BASE64; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "Release keystore secret $NAME not set; building unsigned/debug-signed candidate."
            echo "RELEASE_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Release APK
        env:
          SETFLOW_KEYSTORE: ${{ runner.temp }}/release.jks
          SETFLOW_KEYSTORE_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.SETFLOW_KEYSTORE_PASSWORD || secrets.SETFLOW_STABLE_KEYSTORE_PASSWORD }}
          SETFLOW_KEY_ALIAS: ${{ contains(github.ref_name, '-') && secrets.SETFLOW_KEY_ALIAS || secrets.SETFLOW_STABLE_KEY_ALIAS }}
          SETFLOW_KEY_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.SETFLOW_KEY_PASSWORD || secrets.SETFLOW_STABLE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease :app:collectApks \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PupdateRepo="$GITHUB_REPOSITORY"

      # This version's section of CHANGELOG.md becomes the release description.
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md || true
          PREVIOUS="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ ! -s release-notes.md ] && [ "$VERSION" != "${VERSION%%-*}" ] && [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS" "$GITHUB_REF_NAME" -- ../CHANGELOG.md | grep '^+- ' | sed 's/^+//' > release-notes.md || true
          fi
          [ -s release-notes.md ] || awk -v v="${VERSION%%-*}" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md || true
          [ -s release-notes.md ] || echo "See the commits since the previous release." > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: base/app/build/release-apks/*
          body_path: base/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Discord announcement
        continue-on-error: true
        working-directory: .
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.SETFLOW_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/discord_release.py "$GITHUB_REF_NAME"
