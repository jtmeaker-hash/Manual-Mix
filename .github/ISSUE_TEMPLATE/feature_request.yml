name: Feature Request
description: Suggest an idea or enhancement for SetFlow
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        SetFlow is an offline, standalone Android DJ set builder under GPL-3.0.
        Please note that cloud sync, streaming service DRM bypass, or advertising integrations are out of scope by design.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the limitation or workflow hurdle.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features considered.
    validations:
      required: false
